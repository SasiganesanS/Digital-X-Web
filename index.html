<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/fav.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praskla DigitalX — A Mindful Marketing and Production Firm</title>
  <style>
    html,
    body,
    #root {
      background-color: #080808;
      min-height: 100%;
    }

    link[rel="icon"] {
      border-radius: 50%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="root">
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <filter id="wavy-glass">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="3" result="noise" />

          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <filter id="liquid-distortion">
          <feTurbulence type="fractalNoise" baseFrequency="0.01 0.03" numOctaves="1" result="turbulence">
            <animate attributeName="baseFrequency" dur="10s" values="0.01 0.03;0.02 0.04;0.01 0.03"
              repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="15" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
  </div>
  <div id="portal-root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
