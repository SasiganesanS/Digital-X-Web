<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Adaptive Favicons for Light & Dark Mode -->
  <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-dark-32x32.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32x32.png" media="(prefers-color-scheme: light)" />
  <link rel="shortcut icon" href="/favicon-dark.png" />

  <!-- Touch Icons -->
  <link rel="apple-touch-icon" href="/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-light.png" media="(prefers-color-scheme: light)" />

  <!-- Adaptive Theme Color -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />

  <!-- Dynamic Realtime Favicon Switcher -->
  <script>
    (function() {
      function updateFavicon() {
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const icon = isDark ? '/favicon-dark.png' : '/favicon-light.png';
        const appleIcon = isDark ? '/apple-touch-icon-dark.png' : '/apple-touch-icon-light.png';
        
        let link = document.querySelector('link[rel="icon"]:not([media])');
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          link.type = 'image/png';
          document.head.appendChild(link);
        }
        link.href = icon;

        let appleLink = document.querySelector('link[rel="apple-touch-icon"]:not([media])');
        if (!appleLink) {
          appleLink = document.createElement('link');
          appleLink.rel = 'apple-touch-icon';
          document.head.appendChild(appleLink);
        }
        appleLink.href = appleIcon;
      }

      updateFavicon();
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
      }
    })();
  </script>

  <!-- Google Fonts Preconnect & Inter Font Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praskle Digital X</title>
  <style>
    html,
    body,
    #root {
      background-color: #080808;
      min-height: 100%;
    }
  </style>
</head>

<body>
  <div id="root">
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <filter id="wavy-glass">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="3" result="noise" />

          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <filter id="liquid-distortion">
          <feTurbulence type="fractalNoise" baseFrequency="0.01 0.03" numOctaves="1" result="turbulence">
            <animate attributeName="baseFrequency" dur="10s" values="0.01 0.03;0.02 0.04;0.01 0.03"
              repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="15" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
  </div>
  <div id="portal-root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
